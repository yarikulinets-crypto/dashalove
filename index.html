<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Даши ❤️</title>
    <style>
        /* Романтичный анимированный фон */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ff758c, #ff7eb3);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            user-select: none; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Стиль текста */
        h1 {
            color: #fff;
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(200, 0, 50, 0.4);
            padding: 0 20px;
            z-index: 5;
            line-height: 1.4;
        }

        .highlight {
            font-size: 3.5rem;
            display: block;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Стили для летающих эмодзи */
        .emoji {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        .fly-auto { animation: flyUp 4s linear forwards; }

        @keyframes flyUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .pop-click { animation: popOut 0.8s ease-out forwards; }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); opacity: 0; }
        }

        /* Модальное окно */
        .prank-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(200, 0, 50, 0.3);
            text-align: center;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
            max-width: 400px;
            border: 3px solid #ff7eb3;
        }

        .prank-modal.show { transform: translate(-50%, -50%) scale(1); }

        .prank-modal p {
            font-size: 1.6rem;
            color: #d81b60;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            justify-content: space-around;
            position: relative;
            height: 50px; 
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn:active { transform: scale(0.9); }

        .btn-yes { background-color: #ff4081; color: white; }
        
        /* Стили для убегающей кнопки */
        .btn-no { 
            background-color: #f5f5f5; 
            color: #d81b60; 
            position: fixed; 
            transition: all 0.1s ease; 
            z-index: 1001;
        }

        /* Мелкие окошки с фразами и котиками */
        .mini-prank {
            position: fixed;
            background: #fff;
            color: #d81b60;
            padding: 10px 15px;
            border: 3px solid #ff7eb3;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            z-index: 999;
            animation: popMini 3s forwards;
            text-align: center;
            pointer-events: none; 
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 80vw; /* Ограничиваем ширину на телефонах */
        }

        .mini-prank img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0; /* Чтобы картинка не сжималась */
        }

        @keyframes popMini {
            0% { transform: scale(0) rotate(-15deg); opacity: 1; }
            20% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>
        Даша, привет! Это Ярик<br>
        <span class="highlight">Я тебя люблю ❤️</span>
    </h1>

    <script>
        const emojis = ['❤️', '💖', '😘', '🌸', '🎁', '✨', '💌', '🌹', '😻', '💍'];
        
        // --- 1. АВТОМАТИЧЕСКИЕ ЭМОДЗИ ---
        function createAutoEmoji() {
            const el = document.createElement('div');
            el.className = 'emoji fly-auto';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 2.5 + 1.5) + 'rem';
            el.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }
        setInterval(createAutoEmoji, 400);

        // --- 2. ЭМОДЗИ ПРИ КЛИКЕ ---
        function createClickEmoji(x, y) {
            const el = document.createElement('div');
            el.className = 'emoji pop-click';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = (Math.random() * 1.5 + 2) + 'rem';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 120 + 40;
            
            el.style.setProperty('--x', Math.cos(angle) * distance + 'px');
            el.style.setProperty('--y', Math.sin(angle) * distance + 'px');
            el.style.setProperty('--r', Math.random() * 360 - 180 + 'deg');

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // --- 3. ЛОГИКА ВЗАИМОДЕЙСТВИЯ ---
        let isPrankActive = false; 

        document.body.addEventListener('pointerdown', function(e) {
            if(e.target.tagName === 'BUTTON') return;

            for (let i = 0; i < 5; i++) {
                createClickEmoji(e.clientX, e.clientY);
            }

            if (!isPrankActive && !document.querySelector('.prank-modal')) {
                showPrankModal();
            }
        });

        function showPrankModal() {
            isPrankActive = true;

            const modal = document.createElement('div');
            modal.className = 'prank-modal';
            modal.innerHTML = `
                <p>Ты меня любишь????? 🥺</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="btnYes">ДА! ❤️</button>
                    <button class="btn btn-no" id="btnNo">НЕТ</button>
                </div>
            `;
            document.body.appendChild(modal);

            setTimeout(() => modal.classList.add('show'), 10);

            const btnNo = modal.querySelector('#btnNo');
            const btnYes = modal.querySelector('#btnYes');

            // Функция телепортации кнопки "НЕТ" (в пределах экрана)
            const teleportNo = (e) => {
                e.preventDefault(); 
                
                // Получаем размеры кнопки, чтобы она не улетала за край
                const btnWidth = btnNo.offsetWidth;
                const btnHeight = btnNo.offsetHeight;
                
                // Вычисляем безопасные границы (чтобы кнопка не вылезла за экран)
                const maxX = window.innerWidth - btnWidth - 20; // отступ 20px справа
                const maxY = window.innerHeight - btnHeight - 20; // отступ 20px снизу
                
                // Генерируем случайные координаты
                const randomX = Math.max(20, Math.random() * maxX); 
                const randomY = Math.max(20, Math.random() * maxY);

                // Применяем координаты
                btnNo.style.left = randomX + 'px';
                btnNo.style.top = randomY + 'px';
            };

            btnNo.addEventListener('mouseover', teleportNo);
            btnNo.addEventListener('touchstart', teleportNo);

            // Кнопка "Да" — запускает рой
            btnYes.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                modal.remove(); 
                triggerMiniPranks(); 
            });
        }

        function triggerMiniPranks() {
            const texts = [
                "Дашенька любименькая сучечка",
                "Любименькая кошечка",
                "Маленькая такая Киса",
                "Люлбббббллююююю",
                "❤️❤️❤️",
                "Мур-мур 😻"
            ];
            
            let count = 0;
            const maxPranks = 20; 

            const spawnMini = () => {
                if (count >= maxPranks) {
                    setTimeout(() => { isPrankActive = false; }, 3000);
                    return;
                }

                const mini = document.createElement('div');
                mini.className = 'mini-prank';
                
                const randomText = texts[Math.floor(Math.random() * texts.length)];
                
                // Используем надежный сервис cataas.com для случайных котиков
                // ?random=... заставляет сервер выдавать каждый раз новую картинку
                const randomCat = `https://cataas.com/cat?width=100&height=100&random=${Math.random()}`;

                mini.innerHTML = `<img src="${randomCat}" alt="cat"> <span>${randomText}</span>`;
                
                // Позиция в пределах экрана
                const maxX = window.innerWidth - 250; 
                const maxY = window.innerHeight - 100;
                
                // Если экран телефона слишком узкий, ставим отступ поменьше
                const x = Math.max(10, Math.random() * (maxX > 0 ? maxX : window.innerWidth - 50)); 
                const y = Math.max(10, Math.random() * (maxY > 0 ? maxY : window.innerHeight - 50));
                
                mini.style.left = x + 'px';
                mini.style.top = y + 'px';

                if (randomText.length > 15) {
                    mini.style.fontSize = '1rem';
                }

                document.body.appendChild(mini);
                setTimeout(() => mini.remove(), 3000);

                count++;
                setTimeout(spawnMini, Math.random() * 150 + 100);
            };

            spawnMini();
        }
    </script>
</body>
</html>
