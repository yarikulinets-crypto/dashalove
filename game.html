<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приключение Ярика и Даши</title>
    <style>
        /* Базовые стили */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #000;
            transition: background-image 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        /* Затемнение фона для читаемости текста */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Кнопка звука */
        #soundBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            z-index: 2000;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        #soundBtn:hover {
            background: white;
            color: black;
        }

        /* Окно игры (Стеклянный эффект) */
        .game-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            color: white;
        }

        /* Эмодзи-персонажи в окне */
        .illustration {
            font-size: 5rem;
            margin: 10px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-text {
            font-size: 1.3rem;
            margin: 20px 0;
            min-height: 100px;
            line-height: 1.6;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-choice {
            padding: 16px;
            font-size: 1.1rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .btn-choice:hover {
            background-color: #ff4081;
            border-color: #ff4081;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.4);
        }

        .btn-choice:active {
            transform: translateY(0);
        }

        /* Анимация появления текста */
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Индикатор загрузки */
        .loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            color: white;
            font-size: 1.5rem;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <!-- Заставка для загрузки -->
    <div class="loading" id="loadingScreen">Загрузка приключения... 🚀</div>

    <button id="soundBtn">🔇 Включить звук</button>

    <div class="game-container" id="gameBox" style="display: none;">
        <div class="illustration" id="charEmoji">🧑</div>
        <div class="story-text" id="storyText">Загрузка...</div>
        <div class="choices" id="choicesBox"></div>
    </div>

    <script>
        // --- 1. НАСТРОЙКА ЗВУКА И РЕСУРСОВ ---
        let audioCtx;
        let soundEnabled = false;
        const soundBtn = document.getElementById('soundBtn');
        
        // Ссылки на реальные звуки (свободные библиотеки)
        const sounds = {
            click: 'https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg',
            forest: 'https://actions.google.com/sounds/v1/ambiences/forest_ambience.ogg',
            knock: 'https://actions.google.com/sounds/v1/household/door_knock.ogg',
            happy: 'https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg', // Веселый звук
            wolf: 'https://actions.google.com/sounds/v1/animals/wolf_howl.ogg'
        };

        // Аудио-объекты
        const audioObjects = {};
        for (let key in sounds) {
            audioObjects[key] = new Audio(sounds[key]);
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.innerText = soundEnabled ? "🔊 Звук вкл" : "🔇 Включить звук";
            if (soundEnabled) playSound('click');
        });

        function playSound(type) {
            if (!soundEnabled || !audioObjects[type]) return;
            const audio = audioObjects[type];
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Ошибка звука:", e));
        }

        // --- 2. КРАСИВЫЕ ФОНЫ (Ссылки на Unsplash) ---
        const backgrounds = {
            start: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop', // Красивое море
            forest: 'https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920&auto=format&fit=crop', // Темный лес
            road: 'https://images.unsplash.com/photo-1473042904451-00171c69419d?q=80&w=1920&auto=format&fit=crop', // Дорога на закате
            mushroom: 'https://images.unsplash.com/photo-1518098268026-4e89f1a2cd8e?q=80&w=1920&auto=format&fit=crop', // Волшебный лес
            house: 'https://images.unsplash.com/photo-1518780664697-55e3ad937233?q=80&w=1920&auto=format&fit=crop', // Уютный дом
            love: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1920&auto=format&fit=crop', // Романтика/Сердце
            grandma: 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?q=80&w=1920&auto=format&fit=crop' // Уютная комната
        };

        // --- 3. СЮЖЕТ ---
        const scenes = {
            start: {
                bg: 'start',
                emoji: "🧑🎁💭",
                text: "Привет! Я Ярик. Сегодня я иду к своей любимой Даше, чтобы сделать ей сюрприз. Но подарок я случайно оставил дома. Придется возвращаться или искать другой путь!",
                choices: [
                    { text: "Вернуться за подарком через лес 🌲", next: "forest" },
                    { text: "Пойти в магазин по длинной дороге 🛣️", next: "road" }
                ]
            },
            forest: {
                bg: 'forest',
                emoji: "🌲🐺🧑",
                text: "В лесу темно. Вдруг из кустов выходит волк. Он смотрит на меня голодными глазами. Что делать?",
                sound: 'wolf',
                choices: [
                    { text: "Кинуть ему бутерброд и убежать 🥪", next: "win_forest" },
                    { text: "Заговорить с ним и предложить дружбу 🐺", next: "wolf_friend" }
                ]
            },
            wolf_friend: {
                bg: 'forest',
                emoji: "🐺🤝🧑",
                text: "Волк оказался добрым! Его зовут Серый. Он рассказал, что потерял свой любимый мячик. Ярик помог найти мяч, и волк пропустил его, подарив на удачу клык.",
                sound: 'click',
                choices: [
                    { text: "Идти дальше к дому Даши 🏠", next: "grandma" }
                ]
            },
            win_forest: {
                bg: 'forest',
                emoji: "🧑💨🐺",
                text: "Ярик ловко увернулся от волка и спасся! Но он потерял шапку и немного испугался. Зато жив и здоров.",
                choices: [
                    { text: "Идти дальше к дому Даши 🏠", next: "grandma" }
                ]
            },
            road: {
                bg: 'road',
                emoji: "🧑🛣️☀️",
                text: "Дорога длинная, солнце печет. Ярик нашел на обочине светящийся гриб. Может, это редкий вид?",
                choices: [
                    { text: "Съесть гриб (может, это удача?) 🍄", next: "mushroom" },
                    { text: "Пройти мимо, не трогать 🚶‍♂️", next: "grandma" }
                ]
            },
            mushroom: {
                bg: 'mushroom',
                emoji: "🍄😵‍💫",
                text: "Гриб оказался волшебным. Ярик начал видеть летающих розовых котиков. Он долго смеялся, но потом его отпустило. Настроение — супер!",
                sound: 'happy',
                choices: [
                    { text: "Идти дальше, пока не стемнело 🏠", next: "grandma" }
                ]
            },
            grandma: {
                bg: 'grandma',
                emoji: "👵🧶🧑",
                text: "На пути стоит избушка. В ней живет милая бабушка. Она дает Ярику волшебный клубок, который должен привести его к дому Даши.",
                choices: [
                    { text: "Бросить клубок и идти за ним 🧶", next: "house" }
                ]
            },
            house: {
                bg: 'house',
                emoji: "🏠🚪🧑",
                text: "Вот и дом Даши! Ярик стоит перед дверью. Сердце стучит как бешеное. Он поднимает руку и стучит... Тук-тук-тук!",
                sound: 'knock',
                choices: [
                    { text: "Сказать: 'Даша, я тебя люблю!' ❤️", next: "end_love" },
                    { text: "Сказать: 'Я тут мимо проходил...' 😐", next: "end_shy" }
                ]
            },
            end_love: {
                bg: 'love',
                emoji: "🧑❤️👩",
                text: "Дверь открылась. Даша улыбнулась, обняла Ярика и сказала: 'Я тебя тоже очень сильно люблю!' Подарок был вручен, а счастье — бесконечно! 🎉",
                sound: 'happy',
                choices: [
                    { text: "Играть заново 🔄", next: "start" }
                ]
            },
            end_shy: {
                bg: 'love',
                emoji: "🧑🤡",
                text: "Даша хитро прищурилась: 'Мимо проходил? А я ждала тебя и очень хотела тебя обнять!' И она крепко обняла Ярика. Все равно счастливый конец! ❤️",
                sound: 'happy',
                choices: [
                    { text: "Играть заново 🔄", next: "start" }
                ]
            }
        };

        let currentScene = 'start';
        const charEmoji = document.getElementById('charEmoji');
        const storyText = document.getElementById('storyText');
        const choicesBox = document.getElementById('choicesBox');
        const gameBox = document.getElementById('gameBox');
        const loadingScreen = document.getElementById('loadingScreen');

        // Предзагрузка картинок для плавности
        let loadedImages = 0;
        const totalImages = Object.keys(backgrounds).length;
        
        for (let key in backgrounds) {
            const img = new Image();
            img.src = backgrounds[key];
            img.onload = () => {
                loadedImages++;
                if (loadedImages >= totalImages) {
                    // Когда все картинки загружены, убираем заставку
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        gameBox.style.display = 'block';
                        renderScene(currentScene);
                    }, 500);
                }
            };
            // На случай ошибки загрузки
            img.onerror = () => {
                loadedImages++;
                if (loadedImages >= totalImages) {
                    loadingScreen.style.display = 'none';
                    gameBox.style.display = 'block';
                    renderScene(currentScene);
                }
            }
        }

        function renderScene(sceneKey) {
            const scene = scenes[sceneKey];
            
            // 1. Меняем фон (плавно через CSS transition)
            document.body.style.backgroundImage = `url('${backgrounds[scene.bg]}')`;
            
            // 2. Звук
            if (scene.sound) {
                playSound(scene.sound);
            }
            
            // 3. Персонаж и текст
            charEmoji.innerText = scene.emoji;
            
            storyText.classList.remove('fade-in');
            void storyText.offsetWidth; 
            storyText.classList.add('fade-in');
            storyText.innerText = scene.text;
            
            // 4. Кнопки
            choicesBox.innerHTML = '';
            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'btn-choice';
                btn.innerText = choice.text;
                btn.onclick = () => {
                    playSound('click');
                    renderScene(choice.next);
                };
                choicesBox.appendChild(btn);
            });
        }
    </script>
</body>
</html>
